# OmniHarness App 验证流水线：与本地 `npm run verify` 同一裁决链
# （桌面 GUI 打包除外；桌面纯逻辑判据包含在最后一步）。
# 真实桌面 GUI 冒烟（desktop:smoke）作为 workflow_dispatch 手动门——GUI 在 CI 上偶尔
# 抖（窗口时序/显卡驱动），日常每次 push 都跑会制造噪音；发版前手动触发一次即可。
# 判据布局见 CONTRIBUTING.md。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同分支新推送取消旧跑（省配额；结论以最新一次为准）。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 冒烟会真起 serve 并加载 Windows 风格的桌面侧车路径探测；主开发机是 Windows，
    # 与其赌跨平台路径语义，不如钉在与发布一致的系统上。
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball）
        run: npm ci

      - name: 内核边界门禁（8 条判据；先跑，生成物漂移时给出可执行修复）
        run: npm run kernel:check

      - name: 类型检查（后端 / 前端 / 桌面）
        run: npm run typecheck

      - name: 判据（前端 + 后端 parity/守卫）
        run: npm run web:test

      - name: 构建后端 + 前端
        run: |
          npm run build
          npm run build:web

      - name: 端到端冒烟（真起 serve）
        run: npm run smoke

      - name: 桌面纯逻辑判据（30 条；需本地装 Electron 依赖，与本地 desktop:test 同源）
        run: |
          npm --prefix desktop ci --no-audit --no-fund
          npm run desktop:build
          npm run desktop:test

  # 真实桌面 GUI 验收（窗口/侧车/UI origin/DOM 挂载，退出码即结论）：仅手动触发。
  # 依赖构建产物（侧车 spawn dist + UI 载入 web/dist），故先全量构建再跑 smoke。
  desktop-gui-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball + desktop）
        run: |
          npm ci
          npm --prefix desktop ci --no-audit --no-fund

      - name: 构建后端 + 前端 + 桌面主进程
        run: |
          npm run build
          npm run build:web
          npm run desktop:build

      - name: 真实桌面 GUI 冒烟
        run: npm run desktop:smoke
