# OmniHarness App 验证流水线：与本地 `npm run verify` 同一裁决链（桌面打包除外）。
# 任何 PR / push 到受保护分支都必须全绿；判据布局见 CONTRIBUTING.md。
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # 冒烟会真起 serve 并加载 Windows 风格的桌面侧车路径探测；主开发机是 Windows，
    # 与其赌跨平台路径语义，不如钉在与发布一致的系统上。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball）
        run: npm ci

      - name: 类型检查（后端 / 前端 / 桌面）
        run: npm run typecheck

      - name: 内核边界门禁（7 条判据）
        run: npm run kernel:check

      - name: 判据（前端 + 后端 parity）
        run: npm run web:test

      - name: 构建后端 + 前端
        run: |
          npm run build
          npm run build:web

      - name: 端到端冒烟（真起 serve）
        run: npm run smoke
