# OmniHarness App 验证流水线：与本地 `npm run verify` 同一裁决链（含文档门禁）。
# 真实桌面 GUI 冒烟（desktop-gui-smoke）与发布打包（desktop-package）都是 workflow_dispatch
# 手动门——GUI 在 CI 上偶尔抖（窗口时序/显卡驱动），打包耗时且只在发版前需要。
# 判据布局见 CONTRIBUTING.md。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同分支新推送取消旧跑（省配额；结论以最新一次为准）。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # 冒烟会真起 serve 并加载 Windows 风格的桌面侧车路径探测；主开发机是 Windows，
    # 与其赌跨平台路径语义，不如钉在与发布一致的系统上。
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball + 桌面 Electron 依赖）
        run: |
          npm ci
          npm --prefix desktop ci --no-audit --no-fund

      - name: 内核边界门禁（9 条判据；先跑，生成物漂移时给出可执行修复）
        run: npm run kernel:check

      - name: 文档门禁（相对链接必须存在；域数/域模块数/RPC 方法数与代码实测一致）
        run: npm run docs:check

      - name: 类型检查（后端 / 前端 / 桌面 / 脚本 / 判据五份）
        run: npm run typecheck

      - name: 构建后端 + 前端（web 判据读取 web/dist，必须先构建）
        run: |
          npm run build
          npm run build:web

      - name: 判据（前端 + 后端 parity/守卫）
        run: npm run web:test

      - name: 端到端冒烟（真起 serve）
        run: npm run smoke

      - name: 桌面纯逻辑判据（44 条；依赖已在前置步骤安装，与本地 desktop:test 同源）
        run: |
          npm run desktop:build
          npm run desktop:test

  # 真实桌面 GUI 验收（窗口/侧车/UI origin/DOM 挂载，退出码即结论）：仅手动触发。
  # 依赖构建产物（侧车 spawn dist + UI 载入 web/dist），故先全量构建再跑 smoke。
  desktop-gui-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball + desktop）
        run: |
          npm ci
          npm --prefix desktop ci --no-audit --no-fund

      - name: 构建后端 + 前端 + 桌面主进程
        run: |
          npm run build
          npm run build:web
          npm run desktop:build

      # Electron 二进制缺失时，electron/cli.js 会在冒烟窗口内临时下载 ~100MB，
      # 把 90s 预算挤掉 ⇒ 判「超时」而非真实断言失败（2026-11-10 手动门首跑踩中）。
      - name: 预热 Electron 运行时
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/node_modules/electron/dist/electron.exe')) {
            Write-Host 'Electron 二进制缺失，显式下载……'
            node desktop/node_modules/electron/install.js
          }
          $exe = Get-Item 'desktop/node_modules/electron/dist/electron.exe'
          Write-Host ('electron.exe {0:N1} MB' -f ($exe.Length / 1MB))

      - name: 真实桌面 GUI 冒烟
        shell: pwsh
        env:
          OMNI_SMOKE_TIMEOUT_MS: '300000'
        run: |
          # 无人值守：必须显式给工作区，否则会弹原生目录选择框，一直挂到超时闸才退出。
          $ws = Join-Path $env:RUNNER_TEMP 'omni-smoke-ws'
          New-Item -ItemType Directory -Force -Path $ws | Out-Null
          Push-Location desktop
          node scripts/smoke.mts --workspace $ws
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

  # 发布物打包（stage 含 vendor 与侧车 → electron-builder NSIS → 载荷校验）：仅手动触发。
  # 覆盖 push 流水线不跑的一整段；发版前手动跑一次，产物即安装包。
  # 排在 verify 之后：打包会重编译并复制整棵依赖树，与 chrome 判据并行会抢 CPU/磁盘
  # （2026-11-22 手动门实测：三 job 并行时 providerTilesShots 在渲染等待上踩线判红）。
  desktop-package:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm

      - name: 安装依赖（含 vendored 内核 tarball + desktop）
        run: |
          npm ci
          npm --prefix desktop ci --no-audit --no-fund

      - name: 构建后端 + 前端 + 桌面主进程
        run: |
          npm run build
          npm run build:web
          npm run desktop:build

      # 只打包不发布：electron-builder.yml 配了 GitHub draft 发布，CI 无 GH_TOKEN 会直接报错；
      # 发布仍是人工动作（本地产物 + 手动上传），CI 只负责证明安装包能打出来并通过载荷校验。
      - name: 打 NSIS 安装包并校验载荷（stage + electron-builder --publish never + verify:package）
        run: npm run desktop:dist:ci

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: omni-desktop-installer
          path: desktop/release/*.exe
          if-no-files-found: error
