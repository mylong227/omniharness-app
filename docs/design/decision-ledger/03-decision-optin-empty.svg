Hei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">诊断</text><rect x="24" y="787" width="6" height="6" rx="0" fill="#5f666f" opacity="0.55"/><text x="38" y="797" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">Trace</text><line x1="16" y1="842" x2="240" y2="842" stroke="#e4e4e0" stroke-width="1"/><text x="20" y="863" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" font-weight="400" fill="#565d66">omniharness-app</text><circle cx="22" cy="881" r="3.5" fill="#3a7150"/><text x="32" y="885" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#5f666f">已连接</text><rect x="256" y="0" width="1184" height="900" rx="0" fill="#f8f7f4"/><line x1="256" y1="63" x2="1440" y2="63" stroke="#e4e4e0" stroke-width="1"/><text x="288" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#5f666f">工作台控制台</text><text x="366" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#5f666f">/</text><text x="380" y="38" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#565d66">决策账本</text><rect x="1352" y="24" width="60" height="18" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="1382" y="36.5" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#565d66" text-anchor="middle">Esc 关闭</text><text x="288" y="110" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" fill="#1a1d21" letter-spacing="-0.4">决策账本</text><text x="288" y="137" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#565d66">每一次工具调用，先有裁决，后有动作；这一页回答「为什么允许」。</text><text x="288" y="158" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" font-weight="400" fill="#5f666f">sess_mw7vzh4d_1  ·  重构 Python 客户端并补测试  ·  运行中</text><rect x="1304" y="86" width="104" height="30" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="1356" y="105.5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#1a1d21" text-anchor="middle">查看示例</text><text x="288" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="650" fill="#1a1d21">还没有决策记录</text><text x="288" y="262" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">决策审计当前关闭。开启后，每次工具调用前都会写一条执行前记录。</text><text x="288" y="280" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#7d5a1c">开启之前的回合无法补造——账本只记录未来。</text><rect x="288" y="316" width="580" height="170" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><rect x="304" y="326" width="548" height="28" rx="0" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="318" y="344" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f">#01</text><text x="360" y="344" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#1a1d21">policy_snapshot</text><text x="836" y="344" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f" text-anchor="end">8 rules · 9f3a…</text><rect x="304" y="360" width="548" height="28" rx="0" fill="#eceef7" stroke="#cfd4ea" stroke-width="1"/><text x="318" y="378" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f">#02</text><text x="360" y="378" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#1a1d21">decision · allow</text><text x="836" y="378" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f" text-anchor="end">r 0.122 &lt; τ 0.180</text><rect x="304" y="394" width="548" height="28" rx="0" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="318" y="412" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f">#03</text><text x="360" y="412" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#1a1d21">tool_call · write_file</text><text x="836" y="412" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f" text-anchor="end">auth_01H…</text><rect x="304" y="428" width="548" height="28" rx="0" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="318" y="446" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f">#04</text><text x="360" y="446" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#1a1d21">tool_response · ok</text><text x="836" y="446" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f" text-anchor="end">196ms</text><text x="288" y="530" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1a1d21">开启后怎么用</text><circle cx="306" cy="556" r="12" fill="#eceef7"/><text x="306" y="560" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="650" fill="#3d4a86" text-anchor="middle">1</text><text x="304" y="586" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">开启审计</text><text x="304" y="602" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">写入用户级配置</text><line x1="328" y1="556" x2="472" y2="556" stroke="#e4e4e0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="494" cy="556" r="12" fill="#eceef7"/><text x="494" y="560" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="650" fill="#3d4a86" text-anchor="middle">2</text><text x="492" y="586" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">跑一次工具调用</text><text x="492" y="602" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">产生决策与授权</text><line x1="516" y1="556" x2="660" y2="556" stroke="#e4e4e0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="682" cy="556" r="12" fill="#eceef7"/><text x="682" y="560" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="650" fill="#3d4a86" text-anchor="middle">3</text><text x="680" y="586" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">回来复核 / 导出</text><text x="680" y="602" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">结构 + 共形</text><rect x="288" y="640" width="132" height="30" rx="0" fill="#3d4a86" stroke="#3d4a86" stroke-width="1"/><text x="354" y="659.5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">开启决策审计</text><text x="436" y="659" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#5f666f">不改发放行结果；只追加记录。</text><rect x="916" y="220" width="492" height="490" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="938" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650" fill="#1a1d21">开启后会发生什么</text><circle cx="944" cy="288" r="3.5" fill="#3a7150"/><text x="958" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">每回合 +1 条策略快照</text><text x="958" y="306" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">规则摘要与 hash；不复制规则正文</text><circle cx="944" cy="328" r="3.5" fill="#3a7150"/><text x="958" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">每次工具调用 +1 条决策</text><text x="958" y="346" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">allow / deny / escalate，执行前写入</text><circle cx="944" cy="368" r="3.5" fill="#3a7150"/><text x="958" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">按需追加审批与授权</text><text x="958" y="386" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">单次授权 ID；复核是否复用</text><circle cx="944" cy="408" r="3.5" fill="#3d4a86"/><text x="958" y="412" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">共形放行才有校准证据</text><text x="958" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">α / τ / r / n；可离线重算</text><circle cx="944" cy="448" r="3.5" fill="#3a7150"/><text x="958" y="452" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">不记录参数原文</text><text x="958" y="466" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">只写 request_digest 与风险特征</text><circle cx="944" cy="488" r="3.5" fill="#3a7150"/><text x="958" y="492" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#1a1d21">只写本地，不上传</text><text x="958" y="506" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">用户级 omniharness.json 开关</text><line x1="938" y1="528" x2="1386" y2="528" stroke="#e4e4e0" stroke-width="1"/><text x="938" y="552" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#5f666f">授权主体（可选）</text><rect x="938" y="562" width="448" height="32" rx="0" fill="#ffffff" stroke="#d5d6d1" stroke-width="1"/><text x="950" y="583" font-family="Cascadia Mono, Consolas, monospace" font-size="10.5" font-weight="400" fill="#565d66">local:you</text><text x="938" y="610" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">不填则复核会标记「主体缺失」；不会用当前用户自动回填历史记录。</text><rect x="938" y="626" width="14" height="14" rx="0" fill="#3d4a86"/><text x="941" y="637" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="650" fill="#ffffff">✓</text><text x="960" y="637" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#565d66">我理解：开启前的回合无法补造。</text><rect x="938" y="660" width="132" height="30" rx="0" fill="#3d4a86" stroke="#3d4a86" stroke-width="1"/><text x="1004" y="679.5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">开启并保存</text><rect x="1080" y="660" width="72" height="30" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="1116" y="679.5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#1a1d21" text-anchor="middle">取消</text><text x="938" y="706" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">保存到用户级配置；下一回合生效。</text><text x="288" y="878" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#565d66">决策账本回答「执行前为什么允许」；审计回答「全局记录过什么」；凭证回答「事件是否完整」。三者不合并。</text><text x="1408" y="878" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5f666f" text-anchor="end">草图 03 / 04</text></svg>