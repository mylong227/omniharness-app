="180" width="330" height="430" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="306" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1a1d21">导航落点</text><text x="306" y="226" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">数据与统计</text><text x="312" y="250" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">指标</text><text x="312" y="278" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">活动</text><text x="312" y="306" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">变更</text><text x="312" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">治理</text><text x="312" y="362" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">回滚</text><text x="312" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">审计</text><text x="598" y="390" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#5f666f" text-anchor="end">全局链</text><rect x="296" y="403" width="304" height="24" rx="0" fill="#eceef7"/><text x="312" y="418" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#3d4a86">决策账本</text><text x="598" y="418" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#3d4a86" text-anchor="end">本会话</text><text x="312" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">诊断</text><text x="312" y="474" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">Trace</text><text x="312" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">钻取</text><line x1="306" y1="540" x2="598" y2="540" stroke="#e4e4e0" stroke-width="1"/><text x="306" y="562" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">不放进控制室：控制室回答运行时三问；</text><text x="306" y="578" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">决策账本回答执行前授权，数据源与复核方式不同。</text><text x="650" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1a1d21">数据流</text><rect x="650" y="232" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="666" y="251" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#1a1d21">SessionEvent[]</text><text x="666" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">audit 事件与工具事件（只读）</text><line x1="830" y1="278" x2="830" y2="290" stroke="#d5d6d1" stroke-width="1"/><text x="838" y="287" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="6" font-weight="400" fill="#5f666f">▼</text><rect x="650" y="290" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="666" y="309" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1a1d21">DecisionLedgerService</text><text x="666" y="324" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">过滤 audit / 映射回合 / 计数</text><line x1="830" y1="336" x2="830" y2="348" stroke="#d5d6d1" stroke-width="1"/><text x="838" y="345" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="6" font-weight="400" fill="#5f666f">▼</text><rect x="650" y="348" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#cfd4ea" stroke-width="1"/><text x="666" y="367" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1a1d21">AatExporter.build</text><text x="666" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">确定性 ID + 固定时间锚</text><line x1="830" y1="394" x2="830" y2="406" stroke="#d5d6d1" stroke-width="1"/><text x="838" y="403" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="6" font-weight="400" fill="#5f666f">▼</text><rect x="650" y="406" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="666" y="425" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1a1d21">结构 + 共形复核</text><text x="666" y="440" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">AatExporter.verify / ConformalAatVerifier</text><line x1="830" y1="452" x2="830" y2="464" stroke="#d5d6d1" stroke-width="1"/><text x="838" y="461" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="6" font-weight="400" fill="#5f666f">▼</text><rect x="650" y="464" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="666" y="483" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="600" fill="#1a1d21">decision.session / detail / export / configure</text><text x="666" y="498" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">4 个 RPC；导出与开关都要求确认</text><line x1="830" y1="510" x2="830" y2="522" stroke="#d5d6d1" stroke-width="1"/><text x="838" y="519" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="6" font-weight="400" fill="#5f666f">▼</text><rect x="650" y="522" width="360" height="46" rx="0" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="666" y="541" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1a1d21">Web 决策账本</text><text x="666" y="556" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">列表 / 详情 / 复核抽屉 / 下载</text><rect x="650" y="592" width="360" height="74" rx="0" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="666" y="616" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#1a1d21">离线复核</text><text x="666" y="634" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#565d66">aat.json + .sha256 → 同版本内核 verify</text><text x="666" y="650" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#5f666f">不运行应用、不访问网络；失败即列出问题码。</text><text x="1040" y="208" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1a1d21">四条诚实边界</text><rect x="1040" y="232" width="368" height="92" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><text x="1058" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">覆盖不补造</text><text x="1058" y="280" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">只记录开启后的回合；缺口明确标出。</text><rect x="1040" y="340" width="368" height="92" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><text x="1058" y="366" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">不自证内容为真</text><text x="1058" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">AAT -09 子集、L0、未签名；只证记录与链。</text><text x="1058" y="408" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#7d5a1c">不要把「链自洽」读成「内容可信」。</text><rect x="1040" y="448" width="368" height="92" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><text x="1058" y="474" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">参数不进包</text><text x="1058" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">只留 request_digest 与风险特征，避免泄密。</text><rect x="1040" y="556" width="368" height="92" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><text x="1058" y="582" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#7d5a1c">共形是边际保证</text><text x="1058" y="604" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">可交换性下成立；不是逐调用正确。</text><text x="288" y="650" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1a1d21">与现有入口的分工</text><rect x="288" y="666" width="1120" height="158" rx="0" fill="#fdfcf9" stroke="#e4e4e0" stroke-width="1"/><text x="306" y="690" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#5f666f" letter-spacing="0.4">入口</text><text x="420" y="690" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#5f666f" letter-spacing="0.4">回答的问题</text><text x="760" y="690" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#5f666f" letter-spacing="0.4">数据源</text><text x="1030" y="690" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="600" fill="#5f666f" letter-spacing="0.4">复核方式</text><line x1="306" y1="700" x2="1388" y2="700" stroke="#e4e4e0" stroke-width="1"/><text x="306" y="728" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1a1d21">审计</text><text x="420" y="728" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">全局记录过哪些事件？</text><text x="760" y="728" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#565d66">app 自己的 HMAC 事件链</text><text x="1030" y="728" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#565d66">链连续性（不覆盖决策）</text><text x="306" y="758" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#1a1d21">凭证</text><text x="420" y="758" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">这一回合的事件是否完整？</text><text x="760" y="758" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#565d66">事件流 + 执行证书</text><text x="1030" y="758" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#565d66">Merkle 根 / 证书（事后）</text><rect x="296" y="770" width="1104" height="28" rx="0" fill="#eceef7"/><text x="306" y="788" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="600" fill="#3d4a86">决策账本</text><text x="420" y="788" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9" font-weight="400" fill="#565d66">这次调用为什么被允许？</text><text x="760" y="788" font-family="Cascadia Mono, Consolas, monospace" font-size="8.5" font-weight="400" fill="#565d66">内核 audit 事件 → AAT</text><text x="1030" y="788" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="8.5" font-weight="400" fill="#565d66">AAT 结构 + 共形重算（执行前）</text><text x="288" y="858" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66">决策账本不复制审计的全局链，也不复制凭证的回合证书；它只补上「执行前」这一层。</text><text x="1408" y="878" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5f666f" text-anchor="end">草图 04 / 04</text></svg>