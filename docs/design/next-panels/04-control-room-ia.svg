<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#f8f7f4"/><text x="56" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="28" font-weight="650" fill="#1a1d21" letter-spacing="-0.4">控制室 · 信息架构与关键流程</text><text x="56" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#565d66">一个入口，三种运行视角；不新增第二套导航，也不复制左栏已有入口。</text><text x="56" y="118" font-family="Cascadia Mono, Consolas, monospace" font-size="10" font-weight="400" fill="#5f666f">2026-11-10 · 设计草图 04 / 04</text><rect x="56" y="154" width="388" height="536" rx="12" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="78" y="182" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1a1d21">导航落点</text><text x="78" y="204" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">只增加 1 个条目</text><text x="78" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#5f666f" letter-spacing="0.7">Agent 能力</text><rect x="70" y="242" width="356" height="28" rx="7" fill="#eceef7"/><text x="88" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="600" fill="#3d4a86">控制室</text><text x="170" y="258" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">编队 / 上下文 / 凭证</text><text x="88" y="291" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">配置集</text><text x="88" y="324" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">技能</text><text x="88" y="357" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">记忆</text><text x="88" y="390" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">编排</text><text x="88" y="423" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">自动化</text><text x="88" y="456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">工具</text><text x="78" y="520" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#5f666f" letter-spacing="0.7">数据与统计</text><text x="88" y="546" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="400" fill="#565d66">审计</text><text x="88" y="575" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">凭证不再是第 20 个导航项：审计仍管全局链，</text><text x="88" y="591" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">凭证是控制室里的“这一轮”交付物。</text><text x="488" y="182" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1a1d21">三个模式，三种不同的问题</text><rect x="488" y="208" width="388" height="94" rx="10" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><circle cx="508" cy="233" r="4" fill="#3d4a86"/><text x="522" y="238" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650" fill="#1a1d21">编队</text><text x="522" y="261" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#565d66">谁在跑？跑到哪？改了什么？</text><text x="522" y="281" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="400" fill="#5f666f">SubagentOrchestrator · SubagentResult · worktree</text><rect x="488" y="326" width="388" height="94" rx="10" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><circle cx="508" cy="351" r="4" fill="#7d5a1c"/><text x="522" y="356" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650" fill="#1a1d21">上下文</text><text x="522" y="379" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#565d66">模型还记得什么？下次会丢什么？</text><text x="522" y="399" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="400" fill="#5f666f">ContextCompactor · StateAudit · scratchpad</text><rect x="488" y="444" width="388" height="94" rx="10" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><circle cx="508" cy="469" r="4" fill="#3a7150"/><text x="522" y="474" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650" fill="#1a1d21">凭证</text><text x="522" y="497" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#565d66">这一轮能不能被离线复核？</text><text x="522" y="517" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="400" fill="#5f666f">ExecutionCertificates · Merkle · AuditBundle</text><text x="488" y="580" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#5f666f" letter-spacing="0.7">共同约束</text><text x="488" y="604" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#565d66">· 只有 1 个导航入口；三个 tab 不互相复制按钮。</text><text x="488" y="624" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#565d66">· 默认只读；破坏性动作（取消 / 应用补丁 / 强制压缩）必须二次确认。</text><text x="488" y="644" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#565d66">· 所有导出默认本地、可脱敏；未签名就如实写“未签名”。</text><rect x="920" y="154" width="464" height="536" rx="12" fill="#fdfcf9" stroke="#d5d6d1" stroke-width="1"/><text x="942" y="182" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1a1d21">两条主旅程</text><text x="942" y="216" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#5f666f">A · 并行任务</text><rect x="942" y="234" width="120" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1002" y="257" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">父会话</text><rect x="1090" y="234" width="90" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1135" y="257" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">编队</text><rect x="1202" y="234" width="110" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1257" y="257" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">子代理 ×3</text><rect x="942" y="292" width="120" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1002" y="315" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">补丁回并</text><rect x="1090" y="292" width="90" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1135" y="315" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">凭证</text><text x="1066" y="257" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1182" y="257" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1066" y="315" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1182" y="315" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="942" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">3 个子代理并行 → 变更可回并 → 生成这一轮的凭证</text><text x="942" y="396" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="600" fill="#5f666f">B · 长会话</text><rect x="942" y="414" width="110" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="997" y="437" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">长会话</text><rect x="1072" y="414" width="120" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1132" y="437" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">上下文工坊</text><rect x="1212" y="414" width="90" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1257" y="437" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">压缩点</text><rect x="942" y="472" width="110" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="997" y="495" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">继续任务</text><rect x="1072" y="472" width="90" height="36" rx="8" fill="#f8f7f4" stroke="#e4e4e0" stroke-width="1"/><text x="1117" y="495" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="400" fill="#565d66" text-anchor="middle">凭证</text><text x="1056" y="437" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1196" y="437" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1056" y="495" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="1168" y="495" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#5f666f">→</text><text x="942" y="532" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">写交接便签 → 看清压缩切点 → 继续任务，不重新考古</text><text x="56" y="736" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1a1d21">数据来源与诚实边界</text><text x="56" y="760" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">编队</text><text x="140" y="760" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#565d66">kernel SubagentOrchestrator / SubagentResult</text><text x="650" y="760" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">运行态由服务端 FleetRegistry 聚合；无数据就是 empty，不猜</text><line x1="56" y1="772" x2="1384" y2="772" stroke="#e4e4e0" stroke-width="1"/><text x="56" y="800" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">上下文</text><text x="140" y="800" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#565d66">context.usage · OMNI_COMPACTION_V1 · scratchpad</text><text x="650" y="800" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">估算必须标“估算”；没有压缩记录就显示“尚未压缩”</text><line x1="56" y1="812" x2="1384" y2="812" stroke="#e4e4e0" stroke-width="1"/><text x="56" y="840" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="600" fill="#1a1d21">凭证</text><text x="140" y="840" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#565d66">ExecutionCertificates · EventMerkle · AuditBundle</text><text x="650" y="840" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="9.5" font-weight="400" fill="#5f666f">未签名只报“结构自洽”；不把没查过的签名说成通过</text><line x1="56" y1="852" x2="1384" y2="852" stroke="#e4e4e0" stroke-width="1"/><text x="1384" y="885" font-family="Cascadia Mono, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5f666f" text-anchor="end">草图 04 / 04</text></svg>